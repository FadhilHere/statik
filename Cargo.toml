[workspace]
resolver = "3"
members = [
    "crates/dataset",
    "crates/stat-core",
    "crates/output-model",
    "crates/procedures",
    "crates/statik-cli",
    "crates/sav-io",
    "crates/transform",
    "crates/statik-app",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# The expression parser/evaluator recurses; unoptimised frames are ~10x larger, so keep
# debug builds of it optimised enough that the nesting limits fit a 1 MB main-thread stack.
[profile.dev.package.transform]
opt-level = 1
